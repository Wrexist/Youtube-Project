name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    # The persistence suite falls back to SQLite without this, which would let a
    # Postgres-only problem through — JSON columns and timezone handling differ.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 5s
          --health-retries 10
    env:
      STUDIO_PERSIST: "false"
      STUDIO_TEST_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check engine tests
      - run: ruff format --check engine tests
      - run: pytest -q
      # A migration that does not apply cleanly is a broken deploy, not a broken test.
      #
      # Its own database, deliberately. The persistence fixture calls
      # `create_all` on the `studio` database, so running this against that same
      # one fails with `relation "channel_launches" already exists` — and would
      # only fail *sometimes*, depending on step order. A dedicated database also
      # makes the check mean what it says: migrations applied to an empty schema.
      #
      # `upgrade` alone proves the revisions run; it does not prove they still
      # describe `tables.py`. `check` is what catches a column added to a model
      # without a revision — and that gap is silent in production rather than loud,
      # because boot-time `ensure_schema()` only creates absent *tables*, so a new
      # column on a table that already exists is simply missing.
      - name: Migrations apply to an empty database and match the models
        run: |
          PGPASSWORD=studio createdb -h localhost -U studio migrations_check
          alembic upgrade head
          alembic check
        env:
          STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/migrations_check
      # The committed schema is what generates the web app's types. If a route
      # changed without re-exporting, the contract silently lies.
      - name: openapi.json matches the app
        run: python scripts/export_openapi.py --check

  # vendor/moneyprinterturbo is a read-only reference snapshot. Nothing may import
  # it — the house rules in CLAUDE.md apply only to code that has been ported out.
  vendor-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No imports from vendor/
        run: |
          if grep -rnE '^\s*(from|import)\s+vendor|from vendor\.' apps/; then
            echo "::error::apps/ imports from vendor/ — port the code into engine/services instead"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Tailwind v4 needs a platform-specific native binary, and npm only records
      # the optional dependency for whichever platform generated the lockfile —
      # which is how Windows ended up with no lightningcss at all. This job runs on
      # Linux, so it cannot catch a *missing* win32 entry, but it does catch the
      # pinned versions in optionalDependencies drifting from the installed
      # Tailwind, which is the failure that would silently reintroduce it.
      - run: npm run check:toolchain
      # A stale contract is silent drift: the web app keeps compiling against types
      # the engine no longer serves. Fail the build instead.
      - name: Generated types match openapi.json
        run: npm run check --workspace=@studio/contracts
      - run: npm run lint
      - run: npm run typecheck
      # The web app had no test runner at all until now: CLAUDE.md named vitest as
      # the convention and it was never installed, so every screen was checked by
      # tsc and eslint alone.
      - run: npm run test
      - run: npm run build
      # Deliberately `critical`, not `high`. There are 14 standing high advisories,
      # all transitive build/dev dependencies whose fixes need an upstream Next or
      # eslint-config-next release — see AUDIT.md §4.7 for what each one exposes.
      #
      # This was `npm audit --audit-level=high`, under a comment saying that
      # advisories with no upstream fix belong in an explicit allowlist rather
      # than in a threshold that hides every finding below it. npm has no
      # allowlist, so the comment described a policy the command could not
      # implement — and the first advisory with no reachable fix (js-yaml, via
      # openapi-typescript) turned the step permanently red.
      #
      # `scripts/audit.mjs` is that allowlist: it fails on any high or critical
      # advisory that is not named in it, with the reason it was accepted and
      # what would retire it. Nothing below `high` is hidden that was not hidden
      # before, and an unlisted advisory is still a red build.
      - run: npm run audit
