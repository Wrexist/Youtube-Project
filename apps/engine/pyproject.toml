[project]
name = "studio-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # SQLite is the zero-config default so a fresh clone needs no database server.
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "anthropic>=0.40",
    "cryptography>=44.0",
    "loguru>=0.7",
    "sse-starlette>=2.1",
    "pillow>=11.0",
    "moviepy>=1.0.3",
    "edge-tts>=6.1",
    "faster-whisper>=1.1",
    # Phase 8's statistical gate. Not optional: the pure-Python fallback in
    # stats.py was written against a `math.betainc` that does not exist in any
    # released CPython, so without this every attribution comparison raises.
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.22",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    # Assumes a trio/anyio codebase. We are on asyncio, and the remaining Path
    # calls read a <=2MB thumbnail and a text SRT. The one read that genuinely
    # mattered — 8MB chunks in the upload loop — is on a thread already.
    "ASYNC240",
    # Flags any async function taking a `timeout` argument. Ours is forwarded
    # straight to httpx, which is the intended way to bound an HTTP call.
    "ASYNC109",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
