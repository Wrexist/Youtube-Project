[project]
name = "studio-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # SQLite is the zero-config default so a fresh clone needs no database server.
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    # 1.x, which moved the SDK's HTTP layer to `httpx2` and removed the sampling
    # keywords from `messages.create()` — llm.py and tests/conftest.py are both
    # written against that; a 0.x resolve would break them.
    "anthropic>=1,<2",
    "cryptography>=44.0",
    # ZoneInfo("America/Los_Angeles") — the quota day boundary. The stdlib reads the
    # system tz database, which slim containers and Windows do not ship, so without
    # this the ledger raises ZoneInfoNotFoundError at import on exactly the hosts
    # most likely to run it.
    "tzdata>=2024.2",
    # Verify TLS against the operating system's certificate store instead of
    # certifi's fixed bundle. Not a nicety on a consumer machine: antivirus
    # products with "web shield" or "HTTPS scanning" (AVG, Avast, Kaspersky,
    # ESET, Bitdefender) man-in-the-middle every connection and re-sign it with
    # a root they install into the Windows store. Browsers therefore work and
    # Python does not, failing every outbound call with CERTIFICATE_VERIFY_FAILED
    # while the operator can plainly see the same sites loading in their browser.
    # Corporate proxies and VPNs do the same thing. See engine/tls.py.
    "truststore>=0.10",
    # Imported directly by `review.py`, not merely inherited from pydantic. On
    # Python 3.11 — the version this project targets and CI runs — pydantic refuses
    # to build a schema from a `typing.TypedDict` and demands this one, and
    # `ReviewPayload` is the response model of `GET /v1/insights/review`.
    "typing-extensions>=4.12",
    "loguru>=0.7",
    "sse-starlette>=2.1",
    "pillow>=11.0",
    # 2.x, not 1.x. compose.py is written against the 2.0 API — `with_start`,
    # `with_duration`, `with_effects`, `moviepy.video.fx.Loop` — none of which
    # exist in 1.0.3. The old `>=1.0.3` floor let a resolver pick 1.x and the
    # render then died on an AttributeError at composition time.
    "moviepy>=2.0,<3",
    "edge-tts>=6.1",
    "faster-whisper>=1.1",
    # Phase 8's statistical gate. Not optional: the pure-Python fallback in
    # stats.py was written against a `math.betainc` that does not exist in any
    # released CPython, so without this every attribution comparison raises.
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.22",
    "httpx>=0.28",
    # Imported directly by tests/conftest.py for `alias_httpx()`. Arrives
    # transitively with `anthropic` 1.x anyway; declared because we import it.
    "httpx2>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    # Assumes a trio/anyio codebase. We are on asyncio, and the remaining Path
    # calls read a <=2MB thumbnail and a text SRT. The one read that genuinely
    # mattered — 8MB chunks in the upload loop — is on a thread already.
    "ASYNC240",
    # Flags any async function taking a `timeout` argument. Ours is forwarded
    # straight to httpx, which is the intended way to bound an HTTP call.
    "ASYNC109",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `-p no:respx` blocks respx's entry-point plugin, which imports `httpx` before
# conftest.py can run `httpx2.alias_httpx()` — and an un-aliased respx patches a
# transport the anthropic 1.x SDK no longer uses, so every mocked Anthropic call
# escaped to the real API. The suite only ever uses `@respx.mock` directly, never
# the plugin's `respx_mock` fixture, so nothing is lost by blocking it.
addopts = "-p no:respx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
