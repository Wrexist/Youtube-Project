# Two ways to run this.
#
#   docker compose up -d                    just the infrastructure; you run the
#                                           engine and web yourself — best for
#                                           development, hot reload works
#
#   docker compose --profile full up -d     everything, including the engine, the
#                                           render worker and the web app
#
# Neither is required to try the app. With nothing running here the engine falls
# back to SQLite and runs renders in-process. See SETUP.md.
#
# Every published port is bound to 127.0.0.1 on purpose. `"5432:5432"` binds all
# interfaces, which put Postgres (credentials studio/studio), Redis (no password)
# and an engine with no authentication on whatever network the machine was joined
# to — a café or a hotel wifi is enough. The engine can start a render, read every
# job and publish to a connected YouTube channel, so this was not a theoretical
# exposure. Serving this to anything but the local machine needs a reverse proxy
# that terminates TLS and authenticates; see SETUP.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["127.0.0.1:5432:5432"]
    volumes: [studio-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [studio-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  engine:
    profiles: ["full"]
    build: ./apps/engine
    # A Redis or Postgres bounce takes the client connection down with it, and
    # neither process is written to survive that — see the worker below, which is
    # the one that actually strands work.
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    env_file: [.env]
    environment:
      # Inside the compose network the services have names, not localhost. These
      # override .env, which is written for running on the host.
      STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_STORAGE_ROOT: /data
    volumes:
      - studio-storage:/data
      # The Setup screen writes credentials to `.env`, and the engine's WORKDIR is
      # /app. Without this bind mount that write lands inside the container and is
      # gone on the next `docker compose up` — a save that reports success and
      # silently does not survive a restart. `env_file` above only *reads* the host
      # file at start; it does not make it writable from inside.
      #
      # Run `scripts/setup.sh` before `--profile full`: it creates `.env`, and
      # Docker bind-mounting a path that does not exist creates a *directory*
      # there, at which point `env_file` fails and the file is awkward to undo.
      - ./.env:/app/.env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      retries: 6
      start_period: 20s

  worker:
    profiles: ["full"]
    build: ./apps/engine
    command: ["python", "-m", "arq", "engine.worker.WorkerSettings"]
    # arq's poll loop talks to Redis whether or not a job is running, so a Redis
    # restart kills an *idle* worker too — the job-level retry settings in
    # `engine/worker.py` never get a chance to help, because there is no process
    # left to retry in. Without this the container exits and the queue silently
    # loses its only consumer: renders enqueue, nothing dequeues, and the UI shows
    # jobs sitting at "queued" forever with no error anywhere.
    restart: unless-stopped
    env_file: [.env]
    environment:
      STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_STORAGE_ROOT: /data
    # The same volume as the engine, deliberately: the worker writes the rendered
    # file and the engine serves it, so they have to see one filesystem.
    volumes: [studio-storage:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    profiles: ["full"]
    # Context is the repo root, not apps/web. The web image is a workspace build:
    # its first stage copies `package-lock.json`, `apps/web/package.json` and
    # `packages/contracts/package.json` so npm resolves the same tree CI did, and
    # none of those paths exist under apps/web. With `build: ./apps/web` the very
    # first COPY failed and `--profile full` could never bring the web app up.
    # See the root `.dockerignore` for why the context stays small.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    environment:
      # Resolved by the browser, not inside the network, so it is the host address.
      NEXT_PUBLIC_ENGINE_URL: http://localhost:8080
      # Resolved *inside* the network, by Server Components and Server Actions.
      # They had only the variable above, and localhost:8080 inside the web
      # container is the web container — so every server-side read failed, fell
      # back to demo data, and the app looked like it was working on live data
      # when nothing had reached the engine.
      ENGINE_URL: http://engine:8080
    depends_on:
      engine: {condition: service_started}

volumes:
  studio-pg:
  studio-redis:
  studio-storage:
