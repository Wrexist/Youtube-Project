# Two ways to run this.
#
#   docker compose up -d                    just the infrastructure; you run the
#                                           engine and web yourself — best for
#                                           development, hot reload works
#
#   docker compose --profile full up -d     everything, including the engine, the
#                                           render worker and the web app
#
# Neither is required to try the app. With nothing running here the engine falls
# back to SQLite and runs renders in-process. See SETUP.md.
#
# Every published port is bound to 127.0.0.1 on purpose. `"5432:5432"` binds all
# interfaces, which put Postgres (credentials studio/studio), Redis (no password)
# and an engine with no authentication on whatever network the machine was joined
# to — a café or a hotel wifi is enough. The engine can start a render, read every
# job and publish to a connected YouTube channel, so this was not a theoretical
# exposure. Serving this to anything but the local machine needs a reverse proxy
# that terminates TLS and authenticates; see SETUP.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["127.0.0.1:5432:5432"]
    volumes: [studio-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [studio-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  engine:
    profiles: ["full"]
    build: ./apps/engine
    ports: ["127.0.0.1:8080:8080"]
    env_file: [.env]
    environment:
      # Inside the compose network the services have names, not localhost. These
      # override .env, which is written for running on the host.
      STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_STORAGE_ROOT: /data
    volumes: [studio-storage:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      retries: 6
      start_period: 20s

  worker:
    profiles: ["full"]
    build: ./apps/engine
    command: ["python", "-m", "arq", "engine.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_STORAGE_ROOT: /data
    # The same volume as the engine, deliberately: the worker writes the rendered
    # file and the engine serves it, so they have to see one filesystem.
    volumes: [studio-storage:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    profiles: ["full"]
    build: ./apps/web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      # Resolved by the browser, not inside the network, so it is the host address.
      NEXT_PUBLIC_ENGINE_URL: http://localhost:8080
      # Resolved *inside* the network, by Server Components and Server Actions.
      # They had only the variable above, and localhost:8080 inside the web
      # container is the web container — so every server-side read failed, fell
      # back to demo data, and the app looked like it was working on live data
      # when nothing had reached the engine.
      ENGINE_URL: http://engine:8080
    depends_on:
      engine: {condition: service_started}

volumes:
  studio-pg:
  studio-redis:
  studio-storage:
