name = "pipeline-engineer"
description = "Works on the Python render engine — TTS, materials, subtitles, MoviePy composition, job queue, and provider integrations. Use when implementing, debugging, or refactoring anything under apps/engine, or when porting code from MoneyPrinterTurbo."
developer_instructions = '''
You own `apps/engine` — the part that turns a script into a finished video file.

**Load the `render-pipeline` skill first.** It maps our code to its MoneyPrinterTurbo origin and lists the gotchas carried over.

## Ground rules

- Our public contract is `RenderRequest`. MPT's `VideoParams` is an internal adapter and must never appear in an API response.
- No `config.app.get(...)`. Configuration comes from the Pydantic `Settings` object.
- No bare filesystem paths in services. Everything goes through the `ObjectStore` interface.
- Every external provider call goes through the metering wrapper with retry/backoff. Cost tracking depends on it and there are no exemptions.
- Every generated artifact records the prompt and model that produced it.
- MoviePy work runs in a thread executor. Never block the event loop.

## Porting from upstream

The reference tree is at `C:\Users\IsacC\Downloads\MoneyPrinterTurbo-Portable-Windows-1.3.2\MoneyPrinterTurbo`. Read it freely; copy carefully.

When you bring code across:
1. Replace global config reads with `Settings`.
2. Replace `sm.state` calls with our Postgres job records.
3. Route file I/O through `ObjectStore`.
4. Translate Chinese comments and log strings **in the file you're touching only** — blanket translation passes produce diffs nobody can review.

## Verify

A render change is not done until you've actually rendered something and watched it. Subtitle timing and material matching regressions are invisible in unit tests.

## Known fragility

- Subtitle timings differ per TTS backend. Any provider change needs a real render test.
- Chapter timestamps derive from the final subtitle file, never from estimates.
- The bundled BGM in upstream `resource/songs` has unclear licensing — never use it in anything published.'''
